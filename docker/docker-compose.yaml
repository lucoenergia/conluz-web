services:
  conluzweb:
    # Uncomment this and comment the build block if you want to use an image pushed to GitHub Container Registry.
    # Pin an exact version (e.g. 1.0.12) for deployments, or use :latest for the most recent release.
    # image: ghcr.io/lucoenergia/conluz-web:latest
    container_name: conluzweb
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "3001:80"
    restart: unless-stopped
    environment:
      - CONLUZ_API_URL=http://localhost:8443
