name: Visual regression tests

on:
  push:
    branches: ["main", "develop"]
  pull_request:

concurrency:
  # One group per PR ref, so a new push cancels its superseded run; push and manual runs get a group of their own (run_id), so none of them is ever queued behind, or replaced by, another.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails if `npm ci` rewrote the lockfile, which the npm pin (package.json
      # engines + .npmrc engine-strict) exists to prevent.
      - name: Check the lockfile is unchanged
        run: git diff --exit-code package-lock.json

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run visual regression tests (mobile + desktop)
        run: npm run test:visual

      # !cancelled() rather than always(): a PR run cancelled because a newer
      # push superseded it must not report or upload a partial result.
      - name: Report flaky tests
        id: flaky
        if: ${{ !cancelled() }}
        run: node scripts/report-flaky-tests.mjs reports/visual-results.json

      - name: Upload JSON report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-results
          path: reports/visual-results.json
          # A run that failed before the tests (npm ci, browser install) has no report.
          if-no-files-found: ignore
          retention-days: 14

      # Traces of the retries that turned a failure into a pass. A run that also
      # failed uploads test-results/ through the failure step below instead.
      - name: Upload flaky test traces
        if: steps.flaky.outputs.flaky == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-flaky-traces
          path: test-results/
          retention-days: 7

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-diff
          path: |
            test-results/
            playwright-report/
          retention-days: 7
