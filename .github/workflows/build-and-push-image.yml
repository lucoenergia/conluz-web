# Builds and publishes the Conluz web Docker image to GitHub Container Registry (GHCR).
#
# How it fits in:
#   1. A push to `main` triggers `version-update.yml`, which bumps the patch
#      version and pushes a tag like `1.0.12` using the default GITHUB_TOKEN.
#   2. Tags pushed with GITHUB_TOKEN do NOT trigger downstream workflows, so
#      version-update.yml starts this one explicitly with
#      `gh workflow run build-and-push-image.yml --ref <tag>`. A tag pushed by
#      hand (e.g. to bump minor/major) triggers it through `push: tags`.
#   3. This workflow checks out the tagged commit, runs the checks, bakes the
#      version into the bundle, scans the image with Trivy and publishes it to
#      GHCR only if the scan passes (#307). The scan results go to code
#      scanning under the `container-image` category.
#
# Resulting tags published per release (for tag `1.0.12`):
#   ghcr.io/lucoenergia/conluz-web:1.0.12
#   ghcr.io/lucoenergia/conluz-web:1.0
#   ghcr.io/lucoenergia/conluz-web:1
#   ghcr.io/lucoenergia/conluz-web:latest
#
# Reference: https://docs.github.com/en/packages/working-with-a-github-packages-registry/working-with-the-container-registry

name: Build and push Docker image

on:
  push:
    # Trigger only on version tags (e.g. `1.0.12`) created by version-update.yml.
    # Tags use no `v` prefix, matching the conluz backend.
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  # Also triggered explicitly by version-update.yml via `gh workflow run`, because
  # tags pushed with GITHUB_TOKEN do not fire push events for downstream workflows.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # github.repository is `<owner>/<repo>` (e.g. `lucoenergia/conluz-web`),
  # which is the canonical image name for GHCR.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Same checks as test-n-build.yml, so a failing build is never published.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # Puts npm and npx behind Aikido Safe Chain, so a known-malicious package
      # or one published less than 48 hours ago is blocked before it runs with
      # this job's token (#307).
      # If Aikido's malware list cannot be fetched, installs fail (HTTP 500 from the proxy): re-run the job. The minimum-age check fails open when its list is unavailable.
      - name: Install Safe Chain
        run: |
          curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.26/install-safe-chain.sh -o /tmp/install-safe-chain.sh
          echo "9e4af7107f06d9c0d758cb08fb36804c2af88e24972f3a9d3f8c2bd0ca002adf  /tmp/install-safe-chain.sh" | sha256sum -c -
          sh /tmp/install-safe-chain.sh --ci
          rm /tmp/install-safe-chain.sh
      # The installer only warns when its setup fails; this step fails the job
      # instead, so npm never runs unprotected.
      - name: Verify Safe Chain
        run: npm safe-chain-verify
      - run: npm ci
      # Fails if `npm ci` rewrote the lockfile, which the npm pin (package.json
      # engines + .npmrc engine-strict) exists to prevent.
      - run: git diff --exit-code package-lock.json
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    # `packages: write` is what allows the built-in GITHUB_TOKEN to push to GHCR.
    # `security-events: write` lets it upload the scan results to code scanning.
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      # Checks out the repo at the tag's commit (github.ref is refs/tags/X.Y.Z
      # both for tag pushes and for `gh workflow run --ref X.Y.Z`).
      - name: Checkout repository
        uses: actions/checkout@v5

      # Buildx is a prerequisite for the GitHub Actions cache backend
      # (`type=gha`) configured below.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Authenticates against ghcr.io using the workflow's ephemeral
      # GITHUB_TOKEN — no PAT or repository secret required for publishing.
      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generates the list of image tags + OCI labels from the git ref.
      # For tag `1.0.12`, the four `tags:` lines below produce:
      #   1.0.12, 1.0, 1, latest
      # The labels include org.opencontainers.image.version / .revision /
      # .source, linking every image back to its tag and commit.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      # APP_VERSION is baked into the bundle (see docker/Dockerfile) so the
      # running app reports the same version as its image tag.
      # The image is loaded into the runner, not pushed: it is scanned first,
      # and the push below publishes this same local image. The extra
      # local-only tag gives both scans a fixed name, whatever the ref.
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            conluz-web-scan:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print the local image ID
        run: docker image inspect --format '{{.Id}}' "conluz-web-scan:${GITHUB_SHA}"

      # Every entry must carry an expiry date and a reason (see .trivyignore).
      - name: Lint .trivyignore
        run: |
          bad=$(grep -nEv '^[[:space:]]*(#|$)' .trivyignore | grep -vE 'exp:[0-9]{4}-[0-9]{2}-[0-9]{2}[[:space:]]+.*#[[:space:]]*[^[:space:]]' || true)
          if [ -n "$bad" ]; then
            echo "::error file=.trivyignore::Every entry needs exp:YYYY-MM-DD and a # reason"
            echo "$bad"
            exit 1
          fi

      # Report: CRITICAL and HIGH findings that have a fix, for code scanning.
      # It never fails the job; the gate below does.
      - name: Scan image for the report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: conluz-web-scan:${{ github.sha }}
          version: v0.76.0
          scanners: vuln
          severity: CRITICAL,HIGH
          # Without it the action ignores `severity` for SARIF output.
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "0"
          format: sarif
          output: trivy-results.sarif
          trivyignores: .trivyignore

      - name: Upload scan results to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: container-image

      # Gate (lucoenergia/conluz#474): fails on a CRITICAL vulnerability, in OS
      # packages or application libraries, that has a fix available and is not
      # accepted in .trivyignore. A failure here stops the push below.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: conluz-web-scan:${{ github.sha }}
          version: v0.76.0
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          trivyignores: .trivyignore

      # Publishes the scanned local image under each metadata tag (not the
      # local-only scan tag), and fails if what a tag holds in the registry is
      # not the scanned image: both config digests are printed and compared.
      - name: Push the scanned image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # `docker save` writes the image's config digest into manifest.json
          # (`<hex>.json` or `blobs/sha256/<hex>`) with both the classic and the
          # containerd image store, unlike the local image ID.
          config=$(docker save "conluz-web-scan:${GITHUB_SHA}" | tar -xO manifest.json | jq -r '.[0].Config')
          scanned="sha256:$(basename "$config" .json)"
          echo "Scanned image config digest: $scanned"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker push "$tag"
            manifest=$(docker buildx imagetools inspect --raw "$tag")
            # The containerd image store pushes an index; follow it to the
            # linux/amd64 manifest to reach the config.
            if index_amd64=$(jq -er '.manifests[]? | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' <<< "$manifest"); then
              manifest=$(docker buildx imagetools inspect --raw "${tag%:*}@${index_amd64}")
            fi
            pushed=$(jq -r .config.digest <<< "$manifest")
            echo "$tag config digest: $pushed"
            if [ "$pushed" != "$scanned" ]; then
              echo "::error title=Pushed image differs::$tag has config $pushed, but the scanned image has $scanned"
              exit 1
            fi
          done <<< "$TAGS"
