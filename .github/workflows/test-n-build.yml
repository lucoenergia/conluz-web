# Runs lint, type-check and unit tests on every push and PR.
#
# Images are NOT published from here: a push to `main` goes through
# version-update.yml -> build-and-push-image.yml, which publishes a versioned
# image (X.Y.Z, X.Y, X, latest). On PRs the image is built without pushing, as
# a Dockerfile sanity check, and scanned with Trivy: the job fails on a CRITICAL
# vulnerability that has a fix and is not accepted in .trivyignore (#307).

name: Run unit tests and build image

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

concurrency:
  # One group per PR ref, so a new push cancels its superseded run; push and manual runs get a group of their own (run_id), so none of them is ever queued behind, or replaced by, another.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      # Puts npm and npx behind Aikido Safe Chain, so a known-malicious package
      # or one published less than 48 hours ago is blocked before it runs with
      # this job's token (#307).
      - name: Install Safe Chain
        run: |
          curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.26/install-safe-chain.sh -o /tmp/install-safe-chain.sh
          echo "9e4af7107f06d9c0d758cb08fb36804c2af88e24972f3a9d3f8c2bd0ca002adf  /tmp/install-safe-chain.sh" | sha256sum -c -
          sh /tmp/install-safe-chain.sh --ci
          rm /tmp/install-safe-chain.sh
      # The installer only warns when its setup fails; this step fails the job
      # instead, so npm never runs unprotected.
      - name: Verify Safe Chain
        run: npm safe-chain-verify
      - run: npm ci
      # Fails if `npm ci` rewrote the lockfile, which the npm pin (package.json
      # engines + .npmrc engine-strict) exists to prevent.
      - run: git diff --exit-code package-lock.json
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test

  build:
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: false
          # Loads the image into the runner's Docker so the scan below can read it.
          load: true
          tags: conluz-web:scan
          cache-from: type=gha

      # Every entry must carry an expiry date and a reason (see .trivyignore).
      - name: Lint .trivyignore
        run: |
          bad=$(grep -nEv '^[[:space:]]*(#|$)' .trivyignore | grep -vE 'exp:[0-9]{4}-[0-9]{2}-[0-9]{2}[[:space:]]+.*#[[:space:]]*[^[:space:]]' || true)
          if [ -n "$bad" ]; then
            echo "::error file=.trivyignore::Every entry needs exp:YYYY-MM-DD and a # reason"
            echo "$bad"
            exit 1
          fi

      # Gate (lucoenergia/conluz#474): fails on a CRITICAL vulnerability, in OS
      # packages or application libraries, that has a fix available and is not
      # accepted in .trivyignore.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: conluz-web:scan
          version: v0.76.0
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          trivyignores: .trivyignore
