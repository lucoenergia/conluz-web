# Runs lint, type-check and unit tests on every push and PR.
#
# Images are NOT published from here: a push to `main` goes through
# version-update.yml -> build-and-push-image.yml, which publishes a versioned
# image (X.Y.Z, X.Y, X, latest). On PRs the image is built without pushing, as
# a Dockerfile sanity check.

name: Run unit tests and build image

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci
      # Fails if `npm ci` rewrote the lockfile, which the npm pin (package.json
      # engines + .npmrc engine-strict) exists to prevent.
      - run: git diff --exit-code package-lock.json
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test

  build:
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha
