# Explanation:
#
#  Trigger: The workflow runs when there is a push to the main branch.
#
#  Increment version: The latest existing version tag is read from git (sorted
#  by semantic version), then split into parts (major, minor, patch). The
#  patch version is incremented. The git tag is the single source of truth for
#  the app version (package.json `version` is not used), so nothing is
#  committed to main here — this workflow only creates and pushes a tag, which
#  is unaffected by branch protection rules on `main`.
#
#  Bumping minor/major: push a tag manually on main (e.g. `1.1.0`); the next
#  merge continues from it (`1.1.1`).
#
#  Tagging: The new version is tagged on the current HEAD, and the tag is pushed to the remote repository.
#
#  Image build trigger: Because tags pushed by GITHUB_TOKEN do not fire downstream
#  push-tag events, the build-and-push-image workflow is triggered explicitly via
#  `gh workflow run` (a workflow_dispatch API call). workflow_dispatch with
#  GITHUB_TOKEN IS allowed to start new workflow runs, unlike push events.

name: Version Update
permissions:
  contents: write
  actions: write
on:
  push:
    branches:
      - main

# Two merges landing close together must not both compute the same next tag.
concurrency:
  group: version-update
  cancel-in-progress: false

jobs:
  version-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Increment version and push tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$VERSION" ]; then
            echo "::error::No X.Y.Z version tag found. Seed one first, e.g. 'git tag 1.0.0 && git push origin 1.0.0'."
            exit 1
          fi
          echo "Current version: $VERSION"

          # Increment the patch version (push a manual tag to bump minor/major)
          IFS='.' read -r -a version_parts <<< "$VERSION"
          PATCH=$((version_parts[2] + 1))
          NEW_VERSION="${version_parts[0]}.${version_parts[1]}.$PATCH"
          echo "New version: $NEW_VERSION"

          # Tag the current commit with the new version and push
          echo "Tagging with new version: $NEW_VERSION"
          git tag "$NEW_VERSION"
          git push origin "$NEW_VERSION"

          # Trigger the image build explicitly, because GITHUB_TOKEN tag pushes do
          # not fire downstream push-tag workflow runs.
          gh workflow run build-and-push-image.yml --ref "$NEW_VERSION"
